name: Build Ahmed Elsayed App (APK & AAB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - name: Get dependencies, analyze & test
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > mobile/android/app/upload-keystore.jks
          cat <<EOF > mobile/android/keystore.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Release APK & AAB
        working-directory: mobile
        run: |
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation
          flutter build appbundle --release --target-platform android-arm,android-arm64 --android-skip-build-dependency-validation

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-elsayed-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ahmed-elsayed-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
